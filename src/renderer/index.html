<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: blob:; frame-src *; connect-src 'self'">
  <title>Agent Office</title>
  <link rel="stylesheet" href="../../out/renderer.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <nav class="nav" id="nav">
    <div class="nav-brand" title="Agent Office"></div>
    <div class="nav-group left-tabs">
      <button data-ltab="office" class="on" title="Ofis"><i class="ni">⌂</i><span class="nl">Ofis</span><span id="activeCount" class="nb"></span><span id="guestCount" class="hidden"></span></button>
      <button data-ltab="code" title="Kod"><i class="ni">‹›</i><span class="nl">Kod</span><span id="codeCount" class="nb"></span></button>
    </div>
    <div class="nav-sep"></div>
    <div class="nav-group right-tabs">
      <button data-rtab="chat" title="Takım sohbeti"><i class="ni">✉</i><span class="nl">Sohbet</span><span id="chatCount" class="nb"></span></button>
      <button data-rtab="terminal" class="on" title="Terminal"><i class="ni">▸_</i><span class="nl">Terminal</span></button>
      <button data-rtab="board" title="Görevler"><i class="ni">☰</i><span class="nl">Görevler</span><span id="taskCount" class="nb"></span></button>
      <button data-rtab="review" title="Dal karşılaştırma ve inceleme"><i class="ni">⎇</i><span class="nl">İnceleme</span></button>
      <button data-rtab="reports" title="Raporlar"><i class="ni">▤</i><span class="nl">Raporlar</span><span id="reportCount" class="nb"></span></button>
      <button data-rtab="memory" title="Hafıza"><i class="ni">◎</i><span class="nl">Hafıza</span></button>
      <button data-rtab="browser" title="Tarayıcı"><i class="ni">◐</i><span class="nl">Tarayıcı</span></button>
      <button data-rtab="skills" title="Beceriler"><i class="ni">✦</i><span class="nl">Beceriler</span><span id="skillCount" class="nb"></span></button>
      <button data-rtab="decisions" title="Kararlar"><i class="ni">⚑</i><span class="nl">Kararlar</span><span id="decisionCount" class="nb warn"></span></button>
      <button data-rtab="hub" title="Hub"><i class="ni">⬡</i><span class="nl">Hub</span></button>
    </div>
    <div class="nav-spacer"></div>
    <div class="nav-group nav-bottom">
      <button id="bellBtn" class="bell" title="Bildirimler"><i class="ni">🔔</i><span class="badge"></span></button>
      <button id="tabInfo" title="Hakkında, yenilikler, güncelleme"><i class="ni">ⓘ</i></button>
      <button id="wsMenuBtn" title="Ofisler"><i class="ni">☰</i></button>
    </div>
  </nav>
  <aside class="left" id="left">
      <header class="topbar">
        <button id="wsName" class="ws-name" title="Ofisi değiştir / yeniden adlandır">—</button>
        <span id="wsActive" class="muted">0/0 active</span><i id="wsDot" class="dot"></i>
        <span class="spacer"></span>
        <button id="addWorker" class="btn small">＋ Çalışan</button>
        <button id="addTeam" class="btn small">＋ Takım</button>
        <button id="manageBtn" class="btn small">⚙ Yönet</button>
        <button id="swapBtn" class="btn small" title="3B ofis alanını kapat, yerine terminalleri koy">▮ Terminal</button>
        <button id="editBtn" class="btn small">EDIT</button>
        <button id="tabSwap" class="tab-icon" title="3B ofis alanına terminal koy / geri al">◫</button>
        <button id="tabCollapse" class="tab-icon" title="Ofisi gizle (⌘\)">⇤</button>
        <button id="tabAddWorker" class="hidden"></button>
      </header>
      <section id="ltab-office" class="ltab">
        <div id="leftTerm" class="office-wrap left-term hidden"><div id="panes2" class="panes"></div></div>
        <div id="officeWrap" class="office-wrap">
          <div id="office"></div>
          <div class="zoom"><button id="zoomIn">+</button><button id="zoomOut">−</button></div>
          <div id="editBar" class="edit-bar hidden"></div>
          <div id="noWs" class="no-ws hidden">
            <h2>Ofis kur</h2>
            <p>Bir proje klasörü seç; çalışanlar o klasörde, kendi terminallerinde çalışır.</p>
            <button class="btn primary" id="noWsBtn">📁 Proje klasörü seç</button>
          </div>
        </div>
        <div id="teamBar" class="team-bar"></div>
        <div id="workerCard" class="worker-card hidden"></div>
        <form id="composer" class="composer hidden">
          <textarea id="composerText" rows="1" placeholder="komut yaz…"></textarea>
          <button type="submit" class="send" title="Gönder (Enter)">➤</button>
        </form>
      </section>
      <section id="ltab-code" class="ltab hidden"></section>
    </aside>
    <div class="resizer" id="resizer"></div>
    <nav class="rail" id="officeRail" title="Ofisi göster (⌘\)"><span class="rail-btn">›</span><i class="rail-dot" id="railDot"></i><span class="rail-label">Ofis · Kod</span></nav>
    <main class="right">
      <div class="right-head">
        <h2 id="viewTitle">Terminal</h2><span class="spacer drag"></span>
        <button id="tabNewShell" class="tab-icon" title="Yeni terminal">＋</button>
        <button id="tabSplit" class="tab-icon" title="Odaktaki terminali yana böl">◫</button>
      </div>
      <div id="notifyPanel" class="notify-panel hidden"></div>
      <section id="rtab-terminal" class="rtab">
        <div class="term-bar">
          <span class="label">TERMINALS</span><span class="spacer"></span>
          <span class="seg" id="termSize"><button data-size="S">S</button><button data-size="M" class="on">M</button><button data-size="L">L</button></span>
          <select id="agentPick"><option value="">⚇ agent</option></select>
          <button id="micBtn" class="btn small" title="Konuşarak yaz (⌘⇧M)">🎤</button>
          <button id="addShell" class="btn small">＋ shell</button>
        </div>
        <div id="panes" class="panes"></div>
      </section>
      <section id="rtab-chat" class="rtab hidden"></section>
      <section id="rtab-board" class="rtab hidden"></section>
      <section id="rtab-review" class="rtab hidden"></section>
      <section id="rtab-reports" class="rtab hidden"></section>
      <section id="rtab-memory" class="rtab hidden"></section>
      <section id="rtab-browser" class="rtab hidden"></section>
      <section id="rtab-skills" class="rtab hidden"></section>
      <section id="rtab-decisions" class="rtab hidden"></section>
      <section id="rtab-hub" class="rtab hidden"></section>
    </main>
    <footer class="statusbar" id="statusbar">
    <button id="autopilot" class="autopilot" title="Hands-off: biri bitince sıradaki görev otomatik başlar"><i></i><span>UYUYOR</span><b></b></button>
    <span id="sbWorkers" class="sb"></span><span id="sbCost" class="sb"></span><span id="sbDecisions" class="sb"></span>
    <span class="spacer"></span><span id="sbHint" class="sb muted">⌘K komut paleti</span>
  </footer>
  </div>
  
  <dialog id="dlg"><div id="dlgBody"></div></dialog>
  <div id="toasts"></div>
  <script src="../../out/renderer.js"></script>
</body>
</html>
