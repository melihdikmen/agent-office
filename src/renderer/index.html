<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: blob:; frame-src *; connect-src 'self'">
  <title>Agent Office</title>
  <link rel="stylesheet" href="../../out/renderer.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="left" id="left">
      <div class="tabs left-tabs">
        <button data-ltab="office" class="on">▮ Ofis <span id="activeCount" class="muted"></span><span id="guestCount" class="muted"></span></button>
        <button data-ltab="code">▮ Kod <span id="codeCount" class="muted"></span></button>
        <span class="spacer drag"></span>
        <button id="wsMenuBtn" class="tab-icon" title="Ofisler">☰</button>
      </div>
      <div class="left-tools">
        <button id="addTeam" class="btn small">＋ Takım</button>
        <button id="addWorker" class="btn small">＋ Çalışan</button>
      </div>
      <section id="ltab-office" class="ltab">
        <div class="ws-head">
          <button id="wsName" class="ws-name" title="Ofisi değiştir / yeniden adlandır">—</button>
          <span class="spacer"></span>
          <span id="wsActive" class="muted">0/0 active</span><i id="wsDot" class="dot"></i>
          <button id="manageBtn" class="btn small">⚙ Yönet</button>
          <button id="swapBtn" class="btn small" title="3B ofis alanını kapat, yerine terminalleri koy">▮ Terminal</button>
          <button id="editBtn" class="btn small">EDIT</button>
        </div>
        <div id="leftTerm" class="office-wrap left-term hidden"><div id="panes2" class="panes"></div></div>
        <div id="officeWrap" class="office-wrap">
          <div id="office"></div>
          <div class="zoom"><button id="zoomIn">+</button><button id="zoomOut">−</button></div>
          <div id="editBar" class="edit-bar hidden"></div>
          <div id="noWs" class="no-ws hidden">
            <h2>Ofis kur</h2>
            <p>Bir proje klasörü seç; çalışanlar o klasörde, kendi terminallerinde çalışır.</p>
            <button class="btn primary" id="noWsBtn">📁 Proje klasörü seç</button>
          </div>
        </div>
        <div id="workerCard" class="worker-card hidden"></div>
        <form id="composer" class="composer hidden">
          <textarea id="composerText" rows="1" placeholder="komut yaz…"></textarea>
          <button type="submit" class="send" title="Gönder (Enter)">➤</button>
        </form>
      </section>
      <section id="ltab-code" class="ltab hidden"></section>
      <button id="autopilot" class="autopilot" title="Hands-off: biri bitince sıradaki görev otomatik başlar"><i></i><span>UYUYOR</span><b></b></button>
    </aside>
    <div class="resizer" id="resizer"></div>
    <main class="right">
      <div class="tabs right-tabs">
        <button id="toggleOffice" class="tab-icon" title="Ofisi gizle / göster (⌘\)">◧</button>
        <button data-rtab="terminal" class="on">▮ Terminal</button>
        <button data-rtab="board">▮ Görevler <span id="taskCount" class="muted"></span></button>
        <button data-rtab="reports">▮ Raporlar <span id="reportCount" class="muted"></span></button>
        <button data-rtab="memory">▮ Hafıza</button>
        <button data-rtab="browser">▮ Tarayıcı</button>
        <button data-rtab="hub">▮ Hub</button>
        <span class="spacer drag"></span>
        <button id="bellBtn" class="tab-icon bell" title="Bildirimler">🔔<span class="badge"></span></button>
      </div>
      <div id="notifyPanel" class="notify-panel hidden"></div>
      <section id="rtab-terminal" class="rtab">
        <div class="term-bar">
          <span class="label">TERMINALS</span><span class="spacer"></span>
          <span class="seg" id="termSize"><button data-size="S">S</button><button data-size="M" class="on">M</button><button data-size="L">L</button></span>
          <select id="agentPick"><option value="">⚇ agent</option></select>
          <button id="addShell" class="btn small">＋ shell</button>
        </div>
        <div id="panes" class="panes"></div>
      </section>
      <section id="rtab-board" class="rtab hidden"></section>
      <section id="rtab-reports" class="rtab hidden"></section>
      <section id="rtab-memory" class="rtab hidden"></section>
      <section id="rtab-browser" class="rtab hidden"></section>
      <section id="rtab-hub" class="rtab hidden"></section>
    </main>
  </div>
  <dialog id="dlg"><div id="dlgBody"></div></dialog>
  <div id="toasts"></div>
  <script src="../../out/renderer.js"></script>
</body>
</html>
